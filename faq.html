<!doctype html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Respostes ràpides sobre el compte, l’ús, els preus i el suport de Marca.">
    <title>Preguntes freqüents — Marca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body x-data="siteUI">
    <!-- include:header -->
    <main>
        <section class="hero-glow">
            <div class="mx-auto max-w-3xl px-6 py-20">
            <h1 class="text-4xl font-bold uppercase sm:text-5xl">Preguntes freqüents</h1>
            <p class="mt-4 text-muted">Troba la resposta ràpida a tot el que necessites saber.</p>
            <div class="mt-14 space-y-10"><template
                    x-for="cat in [{name:'Compte',items:[['Com creo un compte?','Accedeix a la pàgina de registre, introdueix les teves dades i segueix les instruccions.'],['Puc fer servir el compte en diversos dispositius?','Sí, pots accedir al teu compte des de qualsevol dispositiu compatible.'],['Com canvio la contrasenya?','Ves a la configuració del compte i selecciona l’opció de canviar la contrasenya.']]},{name:'Ús de l’app',items:[['Quines són les funcions principals?','Pots organitzar continguts, fer cerques i personalitzar el teu espai.'],['Funciona sense connexió?','Algunes funcions bàsiques poden estar disponibles sense connexió.']]},{name:'Preus',items:[['El pla Bàsic té cost?','No, el pla Bàsic és gratuït i inclou les funcions essencials.'],['Puc cancel·lar quan vulgui?','Sí, pots gestionar o cancel·lar la subscripció des del teu compte.']]},{name:'Suport',items:[['Com contacto amb l’equip?','Pots contactar amb nosaltres mitjançant el formulari o el correu de suport.']]}]">
                    <div>
                        <h2 class="text-sm font-semibold uppercase tracking-widest text-mint" x-text="cat.name"></h2>
                        <div class="mt-5 space-y-3"><template x-for="(item,i) in cat.items">
                                <article class="card-surface overflow-hidden">
                                    <button type="button"
                                        class="flex w-full cursor-pointer items-center justify-between gap-4 px-6 py-5 text-left transition-colors hover:bg-secondary/40"
                                        @click="toggleFaq(cat.name.toLowerCase()+'-'+i)"
                                        :aria-expanded="openFaq===cat.name.toLowerCase()+'-'+i">
                                        <span class="font-display font-semibold" x-text="item[0]"></span>
                                        <span class="text-primary transition-transform duration-300"
                                            :class="openFaq===cat.name.toLowerCase()+'-'+i?'rotate-180':''">⌄</span>
                                    </button>
                                    <div x-cloak class="grid transition-[grid-template-rows] duration-300 ease-out"
                                        :class="openFaq===cat.name.toLowerCase()+'-'+i?'grid-rows-[1fr]':'grid-rows-[0fr]'">
                                        <div class="min-h-0 overflow-hidden">
                                            <p class="px-6 pb-5 text-sm leading-relaxed text-muted" x-text="item[1]"></p>
                                        </div>
                                    </div>
                                </article>
                            </template></div>
                    </div>
                </template></div>
            <div class="card-surface mt-16 p-8 text-center">
                <h2 class="text-2xl font-bold">Encara tens dubtes?</h2>
                <p class="mt-2 text-sm text-muted">Estarem encantats d'ajudar-te.</p><a href="contacte.html"
                    class="btn-primary mt-6">Contacta amb nosaltres</a>
            </div>
            </div>
        </section>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
