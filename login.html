<body x-data="siteUI">
    <!-- include:header -->
    <main id="main-content">
        <section class="hero-glow">
            <div class="mx-auto flex max-w-md flex-col px-6 py-20">
            <h1 class="text-center text-3xl font-bold">Inicia sessió</h1>
            <p class="mt-2 text-center text-sm text-muted">Accedeix al teu espai personal.</p>
            <form class="card-surface mt-10 space-y-5 p-8" @submit.prevent="formDone=true"><label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Correu
                        electrònic</span><input required type="email" autocomplete="email" placeholder="tu@correu.com"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label><label
                    class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Contrasenya</span><input
                        required type="password" autocomplete="current-password" placeholder="La teva contrasenya"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label><button
                    type="submit" class="btn-primary w-full">Inicia sessió</button>
                <p x-show="formDone" class="text-center text-sm text-mint">Benvingut de nou a Sonora!</p>
            </form>
            <p class="mt-6 text-center text-sm text-muted">No tens compte? <a href="register.html"
                    class="text-primary hover:underline">Registra’t</a></p>
            </div>
        </section>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
