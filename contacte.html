<!doctype html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Posa't en contacte amb l'equip de Sonora.">
    <title>Contacte — Sonora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body x-data="siteUI">
    <!-- include:header -->
    <main>
        <section class="hero-glow">
            <div class="mx-auto flex max-w-md flex-col px-6 py-20">
            <h1 class="text-center text-3xl font-bold">Contacta amb nosaltres</h1>
            <p class="mt-2 text-center text-sm text-muted">Tens un dubte? Escriu-nos i et respondrem ben aviat.</p>
            <form class="card-surface mt-10 space-y-5 p-8" @submit.prevent="formDone=true">
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Nom</span><input
                        required type="text" placeholder="El teu nom"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label>
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Correu
                        electrònic</span><input required type="email" placeholder="tu@correu.com"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label>
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Assumpte</span><input
                        required type="text" placeholder="En què et podem ajudar?"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label>
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Missatge</span><textarea
                        required rows="5" placeholder="Escriu aquí el teu missatge"
                        class="w-full resize-none rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></textarea></label>
                <button type="submit" class="btn-primary w-full">Envia el missatge</button>
                <p x-show="formDone" class="text-center text-sm text-mint">Gràcies! Hem rebut el teu missatge.</p>
            </form>
            <p class="mt-6 text-center text-sm text-muted">També ens pots escriure a <a
                    href="mailto:hola@sonora.cat" class="text-primary hover:underline">hola@sonora.cat</a></p>
            </div>
        </section>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
