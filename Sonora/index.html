<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>sonora</title>
  </head>
  <body>
    <header class="bg-white" x-data="{menuOpen: false}">
      <div class="flex lg:hidden">
        <button @click="menuOpen=true" type="button" class="-m-2.5 inline-flex items-center
        justify-center rounded-md p-2.5 text-gray-700">
        <button @click="menuOpen=false" type="button" class="-m-2.5 rounded-md p-2.5
        text-gray-700">
        <span class="sr-only">Close menu</span>


      <div x-show="menuOpen" class="lg:hidden" role="dialog" aria-modal="true">
    </header>
  </body>
</html>
