<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="canonical" href="https://2dam-202627-projecte.github.io/Grup2/contactans.html">
    <meta name="theme-color" content="#211e25">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Sonora">
    <meta property="og:locale" content="ca_ES">
    <meta property="og:title" content="Contacte — Sonora">
    <meta property="og:description" content="Posa't en contacte amb l'equip de Sonora.">
    <meta property="og:url" content="https://2dam-202627-projecte.github.io/Grup2/contactans.html">
    <meta property="og:image" content="https://2dam-202627-projecte.github.io/Grup2/wave.jpg">
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:description" content="Posa't en contacte amb l'equip de Sonora.">
    <meta name="twitter:image" content="https://2dam-202627-projecte.github.io/Grup2/wave.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body x-data="siteUI">
    <!-- include:header -->
    <main id="main-content">
        <section class="hero-glow">
            <div class="mx-auto flex max-w-md flex-col px-6 py-20">
            <h1 class="text-center text-3xl font-bold">Contacta amb nosaltres</h1>
            <p class="mt-2 text-center text-sm text-muted">Tens un dubte? Escriu-nos i et respondrem ben aviat.</p>
            <form class="card-surface mt-10 space-y-5 p-8" x-data="{
                      sending: false,
                      sent: false,
                      error: false,
                      async send(e) {
                          this.sending = true;
                          this.error = false;
                          try {
                              const r = await fetch('https://formspree.io/f/mjywydar', {
                                  method: 'POST',
                                  body: new FormData(e.target),
                                  headers: { Accept: 'application/json' }
                              });
                              if (r.ok) { this.sent = true; e.target.reset(); }
                              else { this.error = true; }
                          } catch (err) {
                              this.error = true;
                          }
                          this.sending = false;
                      }
                  }" @submit.prevent="send($event)">
            
                <!-- Anti-spam: els robots l'omplen, les persones no el veuen -->
                <input type="text" name="_gotcha" class="hidden" tabindex="-1" autocomplete="off">
            
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Nom</span><input required
                        type="text" name="nom" autocomplete="name" placeholder="El teu nom"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label>
            
                <label class="block"><span class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Correu
                        electrònic</span><input required type="email" name="email" autocomplete="email" placeholder="tu@correu.com"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label>
            
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Assumpte</span><input required
                        type="text" name="_subject" placeholder="En què et podem ajudar?"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label>
            
                <label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Missatge</span><textarea
                        required rows="5" name="missatge" placeholder="Escriu aquí el teu missatge"
                        class="w-full resize-none rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></textarea></label>
            
                <label class="flex items-start gap-3 text-xs text-muted">
                    <input required type="checkbox" name="privacitat" class="mt-0.5">
                    <span>He llegit i accepto el tractament de les meves dades per respondre la consulta.</span>
                </label>
            
                <button type="submit" class="btn-primary w-full" :disabled="sending"
                    x-text="sending ? 'Enviant...' : 'Envia el missatge'"></button>
            
                <p x-show="sent" x-cloak class="text-center text-sm text-mint">Gràcies! Hem rebut el teu missatge.</p>
                <p x-show="error" x-cloak class="text-center text-sm text-red-400">No s'ha pogut enviar. Torna-ho a provar o
                    escriu-nos per correu.</p>
            </form>
            <p class="mt-6 text-center text-sm text-muted">També ens pots escriure a <a
                    href="mailto:sonorasenselimits@gmail.com" class="text-primary hover:underline">sonorasenselimits@gmail.com</a></p>
            </div>
        </section>
    </main>
    <!-- include:footer -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
