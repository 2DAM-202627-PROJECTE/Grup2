<!doctype html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registra’t a Marca en pocs segons.">
    <title>Crea el teu compte — Marca</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body x-data="siteUI">
    <!-- include:header -->
    <main>
        <section class="hero-glow relative mx-auto flex max-w-md flex-col px-6 py-20">
            <div class="mb-6 text-center text-5xl text-primary">✦</div>
            <h1 class="text-center text-3xl font-bold">Crea el teu compte</h1>
            <p class="mt-2 text-center text-sm text-muted">Comença a gaudir de totes les funcionalitats.</p>
            <form class="card-surface mt-10 space-y-5 p-8" @submit.prevent="formDone=true"><label class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Nom</span><input
                        required type="text" placeholder="El teu nom"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label><label
                    class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Correu
                        electrònic</span><input required type="email" placeholder="tu@correu.com"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label><label
                    class="block"><span
                        class="mb-2 block text-xs font-semibold uppercase tracking-widest text-muted">Contrasenya</span><input
                        required type="password" placeholder="Mínim 8 caràcters"
                        class="w-full rounded-xl border border-border bg-secondary px-4 py-3 text-sm outline-none placeholder:text-muted focus:border-primary"></label><button
                    type="submit" class="btn-primary w-full">Crea el teu compte</button>
                <p x-show="formDone" class="text-center text-sm text-mint">Compte creat! Ja pots iniciar sessió.</p>
            </form>
            <p class="mt-6 text-center text-sm text-muted">Ja tens un compte? <a href="login.html"
                    class="text-primary hover:underline">Inicia sessió</a></p>
        </section>
    </main>
    <!-- include:footer -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
